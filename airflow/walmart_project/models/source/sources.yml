sources:
  - name: walmart_databricks
    database: walmart
    schema: bronze

    config:
      loaded_at_field: updated_timestamp
      freshness:
        warn_after:
          count: 2
          period: day
        error_after:
          count: 2
          period: day

    tables:
      - name: orders
      - name: customers
      - name: employees
      - name: order_items
      - name: products
      - name: stores